# configs/study.yaml — A100 full run config (override on CLI as needed)

# Paths (set these on the A100)
checkpoint:     /workspace/dietcorp-sleep-study/data/best_model_per.pth
data:           /workspace/dietcorp-sleep-study/data/sessions      # dir or .h5 with seq_class_ids
session_stats:  /workspace/dietcorp-sleep-study/data/session_stats.json
lm:             /workspace/dietcorp-sleep-study/data/lm/phoneme_3gram.json
lexicon:        /workspace/dietcorp-sleep-study/data/lm/lexicon.json
word_lm:        /workspace/dietcorp-sleep-study/data/lm/word_3gram.json
word_decode:    true          # also compute word-level WER (needs lexicon)
canonical_wer:  true          # decode words with the word n-gram LM (citable WER)
wer_lm_weight:  1.0
word_lm_weight: 1.0

# Experiment grid
conditions:   [C0, C1, C2, C3a, C3b, C4]
n_steps:      [0, 1, 2, 4, 8]

# Scale (null = all)
max_sessions: null
max_trials:   null

# Consolidation hyperparameters
n_aug:            64
lr:               1.0e-5      # gentle per-trial recalibration (avoids overshoot)
lm_weight:        0.5
buffer_size:      256         # episodic ring (cross-attn read)
replay_capacity:  512         # Simulation-Selection store
replay_k:         2           # prioritized replay trials added to each consolidation batch

out: results
