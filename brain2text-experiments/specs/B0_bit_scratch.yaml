# specs/B0_bit_scratch.yaml
# Track B baseline: BIT encoder trained from scratch (no SSL checkpoint).
# All B1-B5 encoders compare against this, not against the SSL-pretrained BIT.

encoder:
  variant:     bit
  input_dim:   512
  embed_dim:   384
  num_layers:  7
  num_heads:   6
  dropout:     0.2
  attn_dropout: 0.4
  patch_size:  4
  # pretrained_ckpt: null  # explicitly no checkpoint

projector:
  variant:    mlp
  input_dim:  384
  hidden_dim: 1024
  output_dim: 1536

decoder:
  variant:      qwen15
  llm_name:     Qwen/Qwen2.5-1.5B-Instruct
  quantize:     true
  lora_r:       8
  lora_alpha:   32
  lora_dropout: 0.2

loss:
  - variant: ce
  - variant: ctc_anneal
    start_weight:  0.3
    anneal_epochs: null   # fixed weight
  - variant: contrastive
    weight: 1.0
