# specs/D4_label_smooth.yaml
# Track D4: Label Smoothing CE (ε = 0.1)
# Replaces hard one-hot targets with ε-smoothed soft targets.
# Standard regularisation for small datasets; prevents overconfidence
# when the BCI corpus has only a few hundred unique sentences.
#
# Implementation: stages/loss/label_smooth_ce.py
# The label_smooth_ce loss variant wraps nn.CrossEntropyLoss with label_smoothing=0.1.
#
# Run: python run.py --experiment D4 --profile toy

encoder:
  variant:     bit
  input_dim:   512
  embed_dim:   384
  num_layers:  7
  num_heads:   6
  patch_size:  4
  pretrained_ckpt: null

projector:
  variant:    mlp
  input_dim:  384
  hidden_dim: 1024
  output_dim: 1536

decoder:
  variant:      qwen15
  llm_name:     Qwen/Qwen2.5-1.5B-Instruct
  quantize:     true
  lora_r:       8
  lora_alpha:   32
  lora_dropout: 0.2

loss:
  - variant: label_smooth
    eps: 0.1               # ε — fraction of probability mass redistributed
  - variant: ctc_anneal
    start_weight:  0.3
    anneal_epochs: null
  - variant: contrastive
    weight: 1.0
