# specs/E2b_qformer_32.yaml
# Track E2b: Q-Former projector with 32 learned queries
# Output is always (B, 32, 1536) regardless of neural sequence length.
# High impact expected — this is the most promising projector change.

encoder:
  variant:          bit
  input_dim:        512
  embed_dim:        384
  patch_size:       4
  pretrained_ckpt:  null

projector:
  variant:    qformer
  input_dim:  384
  output_dim: 1536
  n_queries:  32
  n_heads:    6

decoder:
  variant:      qwen15
  llm_name:     Qwen/Qwen2.5-1.5B-Instruct
  quantize:     true
  lora_r:       8
  lora_alpha:   32
  lora_dropout: 0.2

loss:
  - variant: ce
  - variant: ctc_anneal
    start_weight:  0.3
    anneal_epochs: null
  - variant: contrastive
    weight: 1.0
