# specs/B4_moe.yaml
# Track B4: MoE encoder (6 specific + 2 shared experts, top-2 routing)
# IMPORTANT: aux_loss_weight must be >0 to prevent expert collapse.

encoder:
  variant:    moe
  input_dim:  512
  embed_dim:  384
  num_layers: 7
  num_heads:  6
  patch_size: 4
  n_specific: 6
  n_shared:   2
  top_k:      2
  dropout:    0.2

projector:
  variant:    mlp
  input_dim:  384
  hidden_dim: 1024
  output_dim: 1536

decoder:
  variant:      qwen15
  llm_name:     Qwen/Qwen2.5-1.5B-Instruct
  quantize:     true
  lora_r:       8
  lora_alpha:   32
  lora_dropout: 0.2

loss:
  - variant: ce
  - variant: ctc_anneal
    start_weight:  0.3
    anneal_epochs: null
  - variant: contrastive
    weight: 1.0

# MoE-specific: aux loss weight for load-balance (wired in run.py)
aux_loss_weight: 0.01
