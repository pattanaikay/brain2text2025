# specs/E1b_gated_mlp.yaml
# Track E1b: Gated MLP Projector (GLU-style multiplicative gating)
# Projection formula per token:
#   h = relu(fc_value(x)) * sigmoid(fc_gate(x))
#   out = fc_out(h)
# Multiplicative gating allows the projector to suppress irrelevant
# neural dimensions dynamically (inspired by LLaMA's SwiGLU).
#
# Run: python run.py --experiment E1b --profile toy

encoder:
  variant:     bit
  input_dim:   512
  embed_dim:   384
  num_layers:  7
  num_heads:   6
  patch_size:  4
  pretrained_ckpt: null

projector:
  variant:    gated
  input_dim:  384
  hidden_dim: 1024    # fc_value and fc_gate both project to this dim
  output_dim: 1536
  activation: relu    # applied to fc_value branch (sigmoid always on gate)
  dropout:    0.1

decoder:
  variant:      qwen15
  llm_name:     Qwen/Qwen2.5-1.5B-Instruct
  quantize:     true
  lora_r:       8
  lora_alpha:   32
  lora_dropout: 0.2

loss:
  - variant: ce
  - variant: ctc_anneal
    start_weight:  0.3
    anneal_epochs: null
  - variant: contrastive
    weight: 1.0
